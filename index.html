<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>HS Central — Promoção</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--navy:#082f51;--blue:#1476df;--bg:#f4f7fa;--card:#fff;--line:#dce4eb;--text:#172333;--muted:#687b8c;--green:#18855f;--red:#b84350;--amber:#d18a00;--shadow:0 8px 28px #18334c18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#07365e,#0a2440)}.loginCard{width:min(430px,94vw);background:#fff;border-radius:10px;padding:32px;box-shadow:0 18px 45px #001b3560}.brand{text-align:center;color:#0b3153;font-size:46px;font-weight:950;letter-spacing:2px;line-height:1}.brand small{display:block;font-size:10px;letter-spacing:5px;margin-top:3px}.loginCard h1{text-align:center;margin:26px 0 2px}.muted{color:var(--muted)}.loginCard>.muted{text-align:center}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px;color:#506474;text-transform:uppercase}.input,select{width:100%;padding:12px 13px;border:1px solid #d5dfe7;border-radius:10px;background:#fff;color:var(--text);outline:none}.input:focus,select:focus{border-color:var(--blue)}.btn{border:1px solid #d6e0e8;border-radius:10px;padding:11px 15px;background:#eef2f6;color:#23384a;font-weight:850;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.good{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.full{width:100%}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0a355b,#062844);padding:22px 14px;position:sticky;top:0;height:100vh}.side .brand{color:#fff;font-size:31px;padding:4px 12px 24px}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;background:transparent;color:#e5eef6;padding:12px 13px;border-radius:10px;font-weight:800}.nav button.active,.nav button:hover{background:#0d5aa0}.main{padding:26px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.top h1{margin:0;font-size:26px}.chip{padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e0e7ed;border-radius:12px;padding:18px;box-shadow:var(--shadow)}.metric span{display:block;color:#647687;font-size:11px;font-weight:900}.metric strong{display:block;font-size:25px;margin-top:5px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sectionTitle h2{margin:0;font-size:18px}.scanGrid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:15px}.manual{display:flex;gap:8px}.manual .input{flex:1}.productCard{border:1px solid var(--line);border-radius:12px;padding:15px;background:#f8fafc;margin-top:12px}.productCode{font-size:22px;font-weight:950;color:#0b3153}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.fact{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.fact small{display:block;color:var(--muted);font-weight:800}.fact b{font-size:16px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}.table th,.table td{padding:11px;border-bottom:1px solid #e6ebef;text-align:left}.table th{background:#f1f4f7;color:#506474;font-size:10px;text-transform:uppercase}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.green{background:#e4f5ed;color:#167a58}.red{background:#fde8eb;color:#b92e3d}.amber{background:#fff2cf;color:#8a5a00}.rowActions{display:flex;gap:7px;flex-wrap:wrap}.discountBar{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:end}.loading{position:fixed;inset:0;background:#06111bd9;display:grid;place-items:center;z-index:3000}.spinner{width:44px;height:44px;border:4px solid #60798d;border-top-color:#2a9cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:18px;bottom:18px;background:#173c5c;color:#fff;padding:13px 16px;border-radius:12px;z-index:4000;box-shadow:var(--shadow);max-width:380px}.modalBack{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:18px;z-index:2500}.modal{width:min(540px,96vw);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px #0005}.modal h3{margin-top:0}.mobileTop,.mobileNav{display:none}
#scanner{position:fixed;inset:0;background:#000e;z-index:5000;display:flex;align-items:center;justify-content:center;padding:14px}.scannerCard{width:min(720px,96vw);background:#0b0b0c;border:1px solid #334155;border-radius:18px;overflow:hidden}.scannerTop{display:flex;justify-content:space-between;align-items:center;padding:12px;color:#fff}.scannerView{padding:10px}.scannerInfo{color:#e5e7eb;text-align:center;padding:12px;border-top:1px solid #334155}.paused{outline:3px solid #22c55e}.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:850px){.shell{display:block}.side{display:none}.main{padding:15px 15px 82px}.mobileTop{display:flex;position:sticky;top:0;z-index:50;background:#082f51;color:#fff;padding:10px 13px;justify-content:space-between}.mobileTop .brand{font-size:20px;color:#fff}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#082f51;z-index:100;padding:7px;overflow:auto}.mobileNav button{flex:1;min-width:76px;border:0;background:transparent;color:#dce8f1;padding:8px 5px;font-size:11px;font-weight:800}.cards,.scanGrid{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.discountBar{grid-template-columns:1fr}.top h1{font-size:22px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginCard"><div class="brand">HS<small>CENTRAL</small></div><h1>Promoção de Loja</h1><div class="muted">Acesso ao sistema</div><div id="loginErr" class="hidden" style="margin:14px 0;color:#b92e3d;font-weight:800"></div><form id="loginForm"><div class="field"><label>Usuário</label><input id="user" class="input" autocomplete="username"></div><div class="field"><label>Senha</label><input id="pass" class="input" type="password" autocomplete="current-password"></div><button class="btn primary full">Entrar</button></form></div></div>
<div id="system" class="hidden"><div class="mobileTop"><div class="brand">HS<small>CENTRAL</small></div><span id="mobileWho"></span></div><div class="shell"><aside class="side"><div class="brand">HS<small>CENTRAL</small></div><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div><div id="mobileNav" class="mobileNav"></div></div>
<div id="scanner" class="hidden"><div class="scannerCard"><div class="scannerTop"><b>Scanner EAN</b><button class="btn" onclick="closeScanner()">Fechar</button></div><div class="scannerView" id="scannerView"><div id="html5-ean"></div></div><div id="scannerInfo" class="scannerInfo">Aponte para o EAN-13 da peça.</div></div></div>
<div id="modal" class="modalBack hidden"><div id="modalBox" class="modal"></div></div>
<div id="loading" class="loading hidden"><div class="spinner"></div></div><div id="toast" class="toast hidden"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyu4WrW945rJlJ9dAu8vhyJAFsdPZchU-eCNB5ZVe5nCODEw1kb3G_vTWPX9UCooF51sw/exec';
const DB_NAME='hs_promocao_v1',DB_STORE='cache';
const S={token:localStorage.getItem('hs_promo_token')||'',user:null,data:null,page:'inicio',catalogo:{},bi:{},precos:{},pending:null,scanner:null,scannerLocked:false};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function load(v=true){$('#loading').classList.toggle('hidden',!v)} function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
async function api(api,p={}){if(!API_URL.startsWith('https://script.google.com/'))throw Error('Configure API_URL no index.html.');const b=new URLSearchParams({api,token:S.token,...Object.fromEntries(Object.entries(p).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v??'')]))});const r=await fetch(API_URL,{method:'POST',body:b,redirect:'follow'});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Resposta inválida do servidor.')}if(!j.ok)throw Error(j.message||'Não foi possível concluir.');return j}
function db(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(DB_STORE);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function cacheSet(k,v){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function cacheGet(k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(DB_STORE).objectStore(DB_STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').classList.add('hidden');try{load();const j=await api('login',{usuario:$('#user').value.trim(),senha:$('#pass').value});S.token=j.token;localStorage.setItem('hs_promo_token',S.token);await boot()}catch(x){$('#loginErr').textContent=x.message;$('#loginErr').classList.remove('hidden')}finally{load(false)}};
async function boot(){const j=await api('bootstrap');S.user=j.user;S.data=j;$('#login').classList.add('hidden');$('#system').classList.remove('hidden');$('#mobileWho').textContent=S.user.perfil==='ADMIN'?'Léo':S.user.filialNome;renderNav();go('inicio');if(S.user.perfil==='FILIAL'){syncBases().then(()=>{if(S.page==='inicio')renderInicio()}).catch(()=>{})}}
function logout(){S.token='';localStorage.removeItem('hs_promo_token');location.reload()}
function navItems(){return S.user.perfil==='ADMIN'?[['inicio','Início'],['analise','Análise'],['filiais','Filiais'],['usuarios','Usuários']]:[['inicio','Início'],['coleta','Bipar peças'],['lista','Minha lista']]}
function renderNav(){let h=navItems().map(([p,n])=>`<button data-p="${p}" onclick="go('${p}')">${n}</button>`).join('')+`<button onclick="logout()">Sair</button>`;$('#nav').innerHTML=h;$('#mobileNav').innerHTML=h}
function head(t,s=''){return `<div class="top"><div><h1>${esc(t)}</h1>${s?`<div class="muted">${esc(s)}</div>`:''}</div><span class="chip">${esc(S.user.perfil==='ADMIN'?'Léo • Admin':S.user.filialNome)}</span></div>`}
function go(p){S.page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({inicio:renderInicio,coleta:renderColeta,lista:renderLista,analise:renderAnalise,filiais:renderFiliais,usuarios:renderUsuarios}[p]||renderInicio)();scrollTo(0,0)}
async function syncBases(){try{const ver=await api('versoesBases');await Promise.all(['catalogo','bi','precos'].map(async tipo=>{const key='base_'+tipo;let local=await cacheGet(key);if(!local||local.versao!==ver[tipo]){const j=await api('carregarBase',{tipo});local={versao:j.versao,dados:j.dados};await cacheSet(key,local)}S[tipo]=local.dados}));return true}catch(e){toast('Não foi possível atualizar as bases: '+e.message);return false}}
function renderInicio(){if(S.user.perfil==='ADMIN'){const fs=S.data.filiais||[],ativas=fs.filter(x=>x.status==='EM_COLETA').length,aguard=fs.filter(x=>x.status==='AGUARDANDO_ANALISE').length;$('#main').innerHTML=head('Painel de Promoções','Controle das filiais e análises.')+`<div class="cards"><div class="card metric"><span>FILIAIS EM COLETA</span><strong>${ativas}</strong></div><div class="card metric"><span>AGUARDANDO ANÁLISE</span><strong>${aguard}</strong></div><div class="card metric"><span>FILIAIS</span><strong>${fs.length}</strong></div></div><div class="sectionTitle"><h2>Filiais</h2></div>${filiaisCards(fs)}`;return}const p=S.data.promocao;$('#main').innerHTML=head('Promoção — '+S.user.filialNome,'Bipe e confirme os itens que irão para análise.')+`<div class="cards"><div class="card metric"><span>STATUS</span><strong style="font-size:18px">${esc(p?.status||'FECHADA')}</strong></div><div class="card metric"><span>ITENS NA LISTA</span><strong>${S.data.itens?.length||0}</strong></div><div class="card metric"><span>BASE LOCAL</span><strong style="font-size:18px">${Object.keys(S.catalogo).length?'PRONTA':'CARREGANDO'}</strong></div></div><button class="btn primary full" style="margin-top:15px" onclick="go('coleta')">Bipar peças</button>`}
function filiaisCards(fs){return `<div class="cards">${fs.map(f=>`<div class="card"><b>${esc(f.nome)}</b><p><span class="badge ${f.status==='EM_COLETA'?'green':f.status==='AGUARDANDO_ANALISE'?'amber':'red'}">${esc(f.status)}</span></p><div class="rowActions">${f.status==='FECHADA'||f.status==='FINALIZADA'?`<button class="btn good" onclick="iniciarPromo('${f.codigo}')">Iniciar promoção</button>`:''}${f.status==='EM_COLETA'?`<button class="btn danger" onclick="fecharPromo('${f.codigo}')">Bloquear coleta</button>`:''}${f.status==='AGUARDANDO_ANALISE'?`<button class="btn primary" onclick="abrirAnalise('${f.codigo}')">Analisar</button>`:''}</div></div>`).join('')}</div>`}
async function renderColeta(){if(S.user.perfil==='ADMIN')return go('inicio');if(!Object.keys(S.catalogo).length){$('#main').innerHTML=head('Bipar peças','Preparando a base local...')+`<div class="card"><b>Carregando catálogo local</b><p class="muted">Na primeira carga pode levar alguns segundos. Depois fica salvo neste aparelho.</p></div>`;const ok=await syncBases();if(!ok||!Object.keys(S.catalogo).length)return; if(S.page!=='coleta')return;}$('#main').innerHTML=head('Bipar peças','Leitura por câmera ou inclusão manual.')+`<div class="scanGrid"><div class="card"><h3>Adicionar peça</h3><button class="btn good full" onclick="openScanner()">📷 Escanear EAN</button><div class="field"><label>Inclusão manual</label><div class="manual"><input id="manualEAN" class="input" inputmode="numeric" maxlength="20" placeholder="Digite ou cole o EAN"><button class="btn primary" onclick="manualEAN()">Adicionar</button></div></div><div id="candidate"></div></div><div class="card"><h3>Lista atual</h3><div id="quickList"></div></div></div>`;$('#manualEAN').onkeydown=e=>{if(e.key==='Enter')manualEAN()};renderQuick()}
function normalize(v){return String(v??'').trim().toUpperCase()}
function biKey(ref,cor,tam){return [normalize(S.user.filialCodigo),normalize(ref),normalize(cor),normalize(tam)].join('|')}
function processEAN(raw){const ean=(String(raw).match(/\d{13}/)||[])[0];if(!ean)return toast('EAN inválido. Informe 13 dígitos.');const c=S.catalogo[ean];if(!c)return toast('EAN não encontrado no catálogo.');const b=S.bi[biKey(c.ref,c.cor,c.tam)]||{};const preco=S.precos[normalize(c.ref)];S.pending={ean,...c,estoque:Number(b.estoque||0),piramide:b.piramide||'',dataUltima:b.dataUltima||'',preco:Number(preco||0)};renderCandidate();return true}
function renderCandidate(){const x=S.pending;if(!x)return;$('#candidate').innerHTML=`<div class="productCard"><div class="productCode">${esc(x.ref)} · ${esc(x.cor)} · ${esc(x.tam)}</div><div class="muted">EAN ${esc(x.ean)}</div><div class="facts"><div class="fact"><small>Estoque</small><b>${x.estoque}</b></div><div class="fact"><small>Preço atual</small><b>${money(x.preco)}</b></div><div class="fact"><small>Pirâmide</small><b>${esc(x.piramide||'-')}</b></div></div><div class="rowActions"><button class="btn good" onclick="confirmItem()">Confirmar item</button><button class="btn" onclick="S.pending=null;$('#candidate').innerHTML=''">Cancelar</button></div></div>`}
async function confirmItem(){if(!S.pending)return;try{load();const j=await api('adicionarItem',{item:S.pending});S.data.itens=j.itens;S.pending=null;renderColeta();toast('Item adicionado.')}catch(e){toast(e.message)}finally{load(false)}}
function manualEAN(){const i=$('#manualEAN');if(processEAN(i.value)){i.value='';i.focus()}}
function renderQuick(){const e=$('#quickList');if(!e)return;const a=S.data.itens||[];e.innerHTML=a.length?a.slice().reverse().slice(0,15).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #e6ebef"><b>${esc(x.ref)} · ${esc(x.cor)} · ${esc(x.tam)}</b><br><span class="muted">Estoque ${x.estoque} • ${money(x.preco)}</span></div>`).join(''):`<div class="empty">Nenhum item adicionado.</div>`}
function renderLista(){const a=S.data.itens||[];$('#main').innerHTML=head('Minha lista','Revise antes de enviar ao Léo.')+itemsTable(a,true)+(a.length?`<button class="btn primary full" style="margin-top:14px" onclick="enviarAnalise()">Enviar lista para análise</button>`:'')}
function itemsTable(a,edit=false){return `<div class="tableWrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Preço atual</th><th>Pirâmide</th><th>Data última</th>${edit?'<th>Ação</th>':''}</tr></thead><tbody>${a.length?a.map(x=>`<tr><td><b>${esc(x.ref)} · ${esc(x.cor)} · ${esc(x.tam)}</b><br><span class="muted">${esc(x.ean||'')}</span></td><td>${x.estoque}</td><td>${money(x.preco)}</td><td>${esc(x.piramide||'-')}</td><td>${esc(x.dataUltima||'-')}</td>${edit?`<td><button class="btn danger" onclick="removerItem('${esc(x.id)}')">Remover</button></td>`:''}</tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum item.</td></tr>`}</tbody></table></div>`}
async function removerItem(id){try{load();const j=await api('removerItem',{id});S.data.itens=j.itens;renderLista()}catch(e){toast(e.message)}finally{load(false)}}
async function enviarAnalise(){if(!confirm('Enviar a lista para análise do Léo?'))return;try{load();await api('enviarAnalise');await refresh();go('inicio');toast('Lista enviada para análise.')}catch(e){toast(e.message)}finally{load(false)}}
async function iniciarPromo(c){try{load();await api('iniciarPromocao',{filialCodigo:c});await refresh();go('inicio')}catch(e){toast(e.message)}finally{load(false)}}
async function fecharPromo(c){try{load();await api('fecharColeta',{filialCodigo:c});await refresh();go('inicio')}catch(e){toast(e.message)}finally{load(false)}}
function renderFiliais(){$('#main').innerHTML=head('Filiais','Inicie ou bloqueie a coleta por filial.')+filiaisCards(S.data.filiais||[])}
async function abrirAnalise(c){S.data.analise=await api('obterAnalise',{filialCodigo:c});S.data.analiseCodigo=c;go('analise')}
function renderAnalise(){const a=S.data.analise;if(!a){const pend=(S.data.filiais||[]).filter(x=>x.status==='AGUARDANDO_ANALISE');$('#main').innerHTML=head('Análise','Escolha uma filial aguardando análise.')+filiaisCards(pend);return}const pir=[...new Set(a.itens.map(x=>x.piramide).filter(Boolean))];$('#main').innerHTML=head('Análise — '+a.filialNome,'Defina descontos e gere o CSV.')+`<div class="card"><div class="discountBar"><div class="field"><label>Aplicar em</label><select id="discTarget"><option value="TODOS">Todos os itens</option>${pir.map(x=>`<option value="${esc(x)}">Pirâmide: ${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Desconto %</label><input id="discPct" class="input" type="number" min="0" max="100" step="0.01"></div><button class="btn primary" onclick="applyDiscount()">Aplicar</button></div></div><div class="sectionTitle"><h2>Itens</h2></div><div class="tableWrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Preço atual</th><th>Data última</th><th>Pirâmide</th><th>Desconto %</th><th>Novo preço</th></tr></thead><tbody>${a.itens.map(x=>`<tr><td><b>${esc(x.ref)} · ${esc(x.cor)} · ${esc(x.tam)}</b></td><td>${x.estoque}</td><td>${money(x.preco)}</td><td>${esc(x.dataUltima||'-')}</td><td>${esc(x.piramide||'-')}</td><td><input class="input" style="width:90px" type="number" min="0" max="100" step=".01" value="${x.desconto||0}" onchange="itemDiscount('${x.id}',this.value)"></td><td><b id="np_${x.id}">${money(calcNew(x.preco,x.desconto))}</b></td></tr>`).join('')}</tbody></table></div><button class="btn good full" style="margin-top:14px" onclick="gerarCSV()">Gerar CSV</button>`}
function calcNew(p,d){return Math.round((Number(p||0)*(1-Number(d||0)/100))*100)/100}
async function itemDiscount(id,v){const pct=Math.max(0,Math.min(100,Number(v)||0));const x=S.data.analise.itens.find(i=>i.id===id);if(x){x.desconto=pct;$('#np_'+id).textContent=money(calcNew(x.preco,pct))}try{await api('salvarDesconto',{id,desconto:pct})}catch(e){toast(e.message)}}
async function applyDiscount(){const t=$('#discTarget').value,p=Math.max(0,Math.min(100,Number($('#discPct').value)||0));try{load();S.data.analise=await api('aplicarDesconto',{filialCodigo:S.data.analiseCodigo,alvo:t,desconto:p});renderAnalise()}catch(e){toast(e.message)}finally{load(false)}}
async function gerarCSV(){try{load();const j=await api('gerarCSV',{filialCodigo:S.data.analiseCodigo});if(j.downloadUrl)window.open(j.downloadUrl,'_blank');await refresh();toast('CSV gerado.')}catch(e){toast(e.message)}finally{load(false)}}
function renderUsuarios(){const fs=S.data.filiais||[];$('#main').innerHTML=head('Usuários','Altere usuário e senha das filiais.')+`<div class="card">${fs.map(f=>`<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #e6ebef"><b>${esc(f.nome)}</b><input id="u_${f.codigo}" class="input" value="${esc(f.usuario)}"><button class="btn primary" onclick="editUser('${f.codigo}')">Editar acesso</button></div>`).join('')}</div>`}
function editUser(c){$('#modalBox').innerHTML=`<h3>Alterar acesso</h3><div class="field"><label>Usuário</label><input id="mu" class="input" value="${esc($('#u_'+c).value)}"></div><div class="field"><label>Nova senha</label><input id="mp" type="password" class="input"></div><div class="rowActions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveUser('${c}')">Salvar</button></div>`;$('#modal').classList.remove('hidden')}
async function saveUser(c){try{load();await api('salvarUsuario',{filialCodigo:c,usuario:$('#mu').value,senha:$('#mp').value});closeModal();await refresh();renderUsuarios();toast('Acesso atualizado.')}catch(e){toast(e.message)}finally{load(false)}}
function closeModal(){$('#modal').classList.add('hidden')}
async function refresh(){const j=await api('bootstrap');S.data=j;S.user=j.user}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function openScanner(){S.scannerLocked=false;$('#scanner').classList.remove('hidden');$('#scannerView').classList.remove('paused');$('#scannerInfo').textContent='Aponte para o EAN-13 da peça.';try{S.scanner=new Html5Qrcode('html5-ean');await S.scanner.start({facingMode:'environment'},{fps:8,qrbox:{width:280,height:220},experimentalFeatures:{useBarCodeDetectorIfSupported:true},rememberLastUsedCamera:true},async text=>{if(S.scannerLocked)return;const e=(String(text).match(/\d{13}/)||[])[0];if(!e)return;S.scannerLocked=true;$('#scannerView').classList.add('paused');$('#scannerInfo').innerHTML=`EAN <b>${e}</b> capturado. Confirme o item e depois toque aqui para liberar o próximo.`;beep();processEAN(e)},()=>{})}catch(e){toast('Não foi possível abrir a câmera.');closeScanner()}}
$('#scannerInfo').onclick=()=>{if(S.scannerLocked){S.scannerLocked=false;$('#scannerView').classList.remove('paused');$('#scannerInfo').textContent='Scanner liberado. Aponte para o próximo EAN-13.'}}
async function closeScanner(){try{if(S.scanner){await S.scanner.stop().catch(()=>{});await S.scanner.clear().catch(()=>{});S.scanner=null}}catch{}$('#scanner').classList.add('hidden')}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;g.gain.value=.12;o.start();o.stop(a.currentTime+.08)}catch{}}
if(S.token)boot().catch(()=>logout());
</script>
</body></html>
