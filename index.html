<body>
<div id="login" class="login"><div class="loginCard"><div class="brand">HS<small>CENTRAL</small></div><h1>Promoção de Loja</h1><div class="muted">Acesso ao sistema</div><div id="loginErr" class="hidden" style="margin:14px 0;color:#b92e3d;font-weight:800"></div><form id="loginForm"><div class="field"><label>Usuário</label><input id="user" class="input" autocomplete="off" autocapitalize="none" spellcheck="false"></div><div class="field"><label>Senha</label><input id="pass" class="input" type="password" autocomplete="new-password"></div><button class="btn primary full">Entrar</button></form></div></div>
<div id="system" class="hidden"><div class="mobileTop"><div class="brand">HS<small>CENTRAL</small></div><span id="mobileWho"></span></div><div class="shell"><aside class="side"><div class="brand">HS<small>CENTRAL</small></div><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div><div id="mobileNav" class="mobileNav"></div></div>
<div id="scanner" class="hidden"><div class="scannerCard"><div class="scannerTop"><b>Scanner EAN</b><button class="btn" onclick="closeScanner()">Fechar</button></div><div class="scannerView" id="scannerView"><div id="html5-ean"></div></div><div id="scannerInfo" class="scannerInfo">Aponte para o EAN-13 da peça.</div></div></div>
<div id="modal" class="modalBack hidden"><div id="modalBox" class="modal"></div></div>
<div id="loading" class="loading hidden"><div class="spinner"></div></div><div id="toast" class="toast hidden"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyu4WrW945rJlJ9dAu8vhyJAFsdPZchU-eCNB5ZVe5nCODEw1kb3G_vTWPX9UCooF51sw/exec';
const DB_NAME='hs_promocao_v1',DB_STORE='cache';
const S={token:localStorage.getItem('hs_promo_token')||'',user:null,data:null,page:'inicio',catalogo:{},bi:{},precos:{},pending:null,scanner:null,scannerLocked:false,baseSyncPromise:null,basesHydrated:false,pendingWrites:0,analysisCache:{},transfer:null,transferPeriod:6,transferCoverage:1,transferProjection:2,transferPyramids:new Set(),transferColumnFilters:{},transferFilterDraft:{},transferFilterOpen:'',transferSort:{key:'',dir:0},transferGenOrigin:'',transferGenRows:[],transferMode:'parado',transferGenDest:'TODAS',repoColumnFilters:{},repoFilterDraft:{},repoFilterOpen:'',repoSort:{key:'reposicao',dir:-1},transferLoading:false,transferCompact:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function load(v=true){$('#loading').classList.toggle('hidden',!v)} function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
async function apiLong(api,p={}){
  const params={api,token:S.token,_ts:Date.now()}; Object.entries(p).forEach(([k,v])=>{params[k]=typeof v==='object'?JSON.stringify(v):String(v??'')}); const b=new URLSearchParams(params);
  const r=await fetch(API_URL,{method:'POST',body:b,redirect:'follow',cache:'no-store'});
  const t=await r.text();
  if(!r.ok)throw Error('HTTP '+r.status);
  let j;try{j=JSON.parse(t)}catch{throw Error('Resposta inválida do servidor.')}
  if(!j.ok)throw Error(j.message||'Não foi possível concluir.');
  return j;
}

async function api(api,p={}){
  if(!API_URL.startsWith('https://script.google.com/'))throw Error('Configure API_URL no index.html.');
  const params={api,token:S.token,_ts:Date.now()};
  Object.entries(p).forEach(([k,v])=>{params[k]=typeof v==='object'?JSON.stringify(v):String(v??'')});
  const b=new URLSearchParams(params);
  const r=await fetch(API_URL,{method:'POST',body:b,redirect:'follow',cache:'no-store'});
  const t=await r.text();
  if(!r.ok)throw Error('HTTP '+r.status);
  let j;
  try{j=JSON.parse(t)}catch{throw Error('Resposta inválida do servidor.')}
  if(!j.ok)throw Error(j.message||'Não foi possível concluir.');
  return j;
}
function db(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(DB_STORE);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function cacheSet(k,v){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function cacheGet(k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(DB_STORE).objectStore(DB_STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').classList.add('hidden');try{load();const j=await api('login',{usuario:$('#user').value.trim(),senha:$('#pass').value});S.token=j.token;localStorage.setItem('hs_promo_token',S.token);await boot()}catch(x){$('#loginErr').textContent=x.message;$('#loginErr').classList.remove('hidden')}finally{load(false)}};
async function boot(){if(!S.basesHydrated)await hydrateLocalBases();const j=await api('bootstrap');S.user=j.user;S.data=j;$('#login').classList.add('hidden');$('#system').classList.remove('hidden');$('#mobileWho').textContent=S.user.perfil==='ADMIN'?'Léo':S.user.filialNome;renderNav();go('inicio');if(S.user.perfil==='FILIAL')syncBases().then(()=>{if(S.page==='inicio')renderInicio()}).catch(()=>{})}
function logout(){S.token='';localStorage.removeItem('hs_promo_token');$('#user').value='';$('#pass').value='';location.reload()}
function navItems(){return S.user.perfil==='ADMIN'?[['inicio','Início'],['transferencia','Transferência'],['atualizarBanco','Atualizar Banco'],['historico','Histórico'],['usuarios','Usuários']]:[['inicio','Início'],['coleta','Bipar peças'],['lista','Minha lista']]}
function renderNav(){let h=navItems().map(([p,n])=>`<button data-p="${p}" onclick="go('${p}')">${n}</button>`).join('')+`<button onclick="logout()">Sair</button>`;$('#nav').innerHTML=h;$('#mobileNav').innerHTML=h}
function head(t,s=''){return `<div class="top"><div><h1>${esc(t)}</h1>${s?`<div class="muted">${esc(s)}</div>`:''}</div><span class="chip">${esc(S.user.perfil==='ADMIN'?'Léo • Admin':S.user.filialNome)}</span></div>`}
function go(p){S.page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({inicio:renderInicio,coleta:renderColeta,lista:renderLista,analise:renderAnalise,historico:renderHistorico,filiais:renderFiliais,usuarios:renderUsuarios,transferencia:renderTransferencia,atualizarBanco:renderAtualizarBanco}[p]||renderInicio)();scrollTo(0,0)}
async function hydrateLocalBases(){
  try{for(const tipo of ['catalogo','bi','precos']){const local=await cacheGet('base_'+tipo);if(local&&local.dados)S[tipo]=local.dados}S.basesHydrated=true;return true}catch(e){S.basesHydrated=true;return false}
}
async function syncBases(){
  if(S.baseSyncPromise)return S.baseSyncPromise;
  S.baseSyncPromise=(async()=>{try{
    const ver=await api('versoesBases');
    const tipos=['catalogo','bi','precos'],faltando=[];
    for(const tipo of tipos){
      const local=await cacheGet('base_'+tipo);
      if(local&&local.versao===ver[tipo])S[tipo]=local.dados;
      else faltando.push(tipo);
    }
    if(!faltando.length)return true;
    const snap=await apiLong('snapshotBases',{tipos:faltando});
    for(const tipo of faltando){
      const local={versao:snap.versoes[tipo],dados:snap.bases[tipo]||{}};
      await cacheSet('base_'+tipo,local);S[tipo]=local.dados;
    }
    return true;
  }catch(e){toast('Não foi possível atualizar as bases: '+e.message);return false}
  finally{S.baseSyncPromise=null}})();
  return S.baseSyncPromise;
}
function statusLabel(s){return ({EM_COLETA:'Em coleta',AGUARDANDO_ANALISE:'Em análise',EM_ANALISE:'Em análise',FINALIZADA:'Finalizada',CANCELADA:'Cancelada',FECHADA:'Fechada'})[String(s||'')]||String(s||'').replaceAll('_',' ')}
function coletaAberta(){return S.data?.promocao?.status==='EM_COLETA'}

function normalize(v){return String(v??'').trim().toUpperCase()}
function displayRef(v){const s=String(v??'').trim();return /^\d+$/.test(s)?s.padStart(4,'0'):s}
function latestKey(ref,cor,tam){return ['__ULTIMA__',normalize(ref),normalize(cor),normalize(tam)].join('|')}
function dateBR(v){
  const s=String(v??'').trim(); if(!s)return '-';
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){let a=Number(m[1]),b=Number(m[2]); if(b>12&&a<=12)[a,b]=[b,a]; return String(a).padStart(2,'0')+'/'+String(b).padStart(2,'0')+'/'+m[3];}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return String(m[3]).padStart(2,'0')+'/'+String(m[2]).padStart(2,'0')+'/'+m[1];
  const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function biKey(ref,cor,tam){return [normalize(S.user.filialCodigo),normalize(ref),normalize(cor),normalize(tam)].join('|')}

async function confirmItem(){
  if(!S.pending)return;
  const item={...S.pending};
  const tempId='LOCAL_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const optimistic={...item,id:tempId,_localPending:true};
  S.data.itens=S.data.itens||[];
  const exists=S.data.itens.some(i=>normalize(i.ref)===normalize(item.ref)&&normalize(i.cor)===normalize(item.cor)&&normalize(i.tam)===normalize(item.tam));
  if(exists){toast('Este item já está na lista.');S.pending=null;renderColeta();return}
  S.data.itens.push(optimistic);S.pending=null;S.pendingWrites++;
  renderColeta();toast('Salvando item...');
  try{
    const j=await apiLong('adicionarItem',{item});
    if(j.itens)S.data.itens=j.itens;
    toast('Item incluído.');
  }catch(e){
    S.data.itens=(S.data.itens||[]).filter(i=>i.id!==tempId);

  }
}

function idbOpenTransfer(){
  return new Promise((resolve,reject)=>{
    const q=indexedDB.open('HS_TRANSFER_CACHE',1);
    q.onupgradeneeded=()=>{const db=q.result;if(!db.objectStoreNames.contains('base'))db.createObjectStore('base')};
    q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
  });
}
async function idbGetTransfer(){
  try{const db=await idbOpenTransfer();return await new Promise((res,rej)=>{const q=db.transaction('base','readonly').objectStore('base').get('compacta');q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(_){return null}
}
async function idbPutTransfer(v){
  try{const db=await idbOpenTransfer();await new Promise((res,rej)=>{const q=db.transaction('base','readwrite').objectStore('base').put(v,'compacta');q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(_){}
}
async function ensureTransferCompact(){
  if(S.transferCompact){buildTransferLocal();return}
  const cached=await idbGetTransfer();
  if(cached&&cached.v===30&&Array.isArray(cached.rows)){
    S.transferCompact=cached;buildTransferLocal();renderTransferenciaTela();
  }
  // Uma consulta apenas por abertura. Depois todos os botões são locais.
  const fresh=await apiLong('baseTransferenciaCompacta');
  if(!fresh||!Array.isArray(fresh.rows))throw Error('Não foi possível carregar a base compacta.');
  S.transferCompact=fresh;await idbPutTransfer(fresh);buildTransferLocal();renderTransferenciaTela();
}
function buildTransferLocal(){

          pir=String(a[4]||'')||'Sem pirâmide',colecaoCod=String(a[5]||''),
          estoque=Number(a[6]||0),transito=Number(a[7]||0),
          v1=Number(a[8]||0),v6=Number(a[9]||0),v12=Number(a[10]||0),ultima=String(a[11]||'');
    const media=S.transferPeriod===1?Math.max(0,v1):S.transferPeriod===12?Math.max(0,v12)/12:Math.max(0,v6)/6;

    bySku[sk].lojas[codigo]={
      codigo,nome:({293:'ARTUR',488:'FLORIANO',287:'JOTA',761:'MODA',288:'PONTO',1849:'DIVINA',1848:'ITAUNA'})[codigo]||codigo,
      estoque,emTransito:transito,media1:media,media6:media,media12:media,
      ultima:ultima?ultima.slice(8,10)+'/'+ultima.slice(5,7)+'/'+ultima.slice(0,4):'',
      ultimaTs:ultima?new Date(ultima+'T00:00:00').getTime()||0:0
    };
    const hk=codigo+'|'+pir;
    if(!health[hk])health[hk]={filial:bySku[sk].lojas[codigo].nome,codigo,piramide:pir,estoque:0,transito:0,media:0};
    health[hk].estoque+=estoque;health[hk].transito+=transito;health[hk].media+=media;
  });
  const nomes={293:'ARTUR',488:'FLORIANO',287:'JOTA',761:'MODA',288:'PONTO',1849:'DIVINA',1848:'ITAUNA'};
  const codigos=['293','488','287','761','288','1849','1848'];
  const itens=Object.values(bySku).map(s=>({
    ...s,lojas:codigos.map(c=>s.lojas[c]||{codigo:c,nome:nomes[c],estoque:0,emTransito:0,media1:0,media6:0,media12:0,ultima:'',ultimaTs:0})
  }));
  S.transfer={ok:true,fonte:'SUPABASE_V30_CACHE_LOCAL',piramides:Object.keys(pirs).sort(),itens,saude:Object.values(health),geradoEm:base.gerado_em||''};

const IMPORT_FILIAIS={
 'HERING AV G VARGAS ITAUNA':{codigo:'1848',nome:'ITAUNA'},
 'HERING AV GETULIO VARGAS':{codigo:'1848',nome:'ITAUNA'},
 'HERING A OLIMPIO D MORAIS':{codigo:'1849',nome:'DIVINA'},
 'HS DIVINOPOLIS':{codigo:'1849',nome:'DIVINA'},
 'HS SHOPPING UBERLANDIA':{codigo:'761',nome:'MODA'},
 'HS UBERLANDIA':{codigo:'488',nome:'FLORIANO'},
 'RUA ARTUR MACHADO':{codigo:'293',nome:'ARTUR'},
 'RUA RIO DE JANEIRO - PCA':{codigo:'287',nome:'JOTA'},
 'SHOPPING CENTER UBERABA':{codigo:'288',nome:'PONTO'}
};
const IMPORT_MESES={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
let IMPORT_RESULT=null,IMPORT_FILE=null;
function impNorm(v){return String(v??'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function impRef(v){const s=impNorm(v);return /^\d+$/.test(s)?s.padStart(4,'0'):s}
function impNum(v){if(typeof v==='number')return Number.isFinite(v)?v:0;let s=String(v??'').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=Number(s.replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0}
function impMes(v){const n=Number(v);if(n>=1&&n<=12)return n;return IMPORT_MESES[impNorm(v).slice(0,3)]||0}
function impIso(d,m,a){d=Number(d);m=impMes(m);a=Number(a);if(!d||!m||!a)return '';const x=new Date(Date.UTC(a,m-1,d));if(x.getUTCFullYear()!=a||x.getUTCMonth()!=m-1||x.getUTCDate()!=d)return '';return `${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}

async function processarImportacao(){
 try{
  if(!IMPORT_FILE)return;
  $('#impProcess').disabled=true;$('#impSend').disabled=true;$('#impProg').value=3;impStatus('Lendo o Excel...');
  const wb=XLSX.read(await IMPORT_FILE.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
  const required=['Loja','Dia','Mês','Ano','Coleção','Coleção Cód','Cor','Pirâmide','Produto Cód','Tamanho','Peças - Líquido','Estoque Físico','Estoque em Trânsito'];
  if(!rows.length)throw Error('O relatório está vazio.');
  const missing=required.filter(k=>!(k in rows[0]));if(missing.length)throw Error('Colunas não encontradas: '+missing.join(', '));
  const produtos=new Map(),vendas=new Map(),desconhecidas=new Set(),filiais=new Set();let validas=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i],lojaRaw=impNorm(r['Loja']);if(!lojaRaw)continue;
    const f=IMPORT_FILIAIS[lojaRaw];if(!f){desconhecidas.add(lojaRaw);continue}
    const rf=impRef(r['Produto Cód']),cor=impNorm(r['Cor']),tam=impNorm(r['Tamanho']);if(!rf||!cor||!tam)continue;
    validas++;filiais.add(f.codigo);const pk=[f.codigo,rf,cor,tam].join('|');
    let p=produtos.get(pk);if(!p){p={filial_codigo:f.codigo,loja:f.nome,ref:rf,cor,tamanho:tam,colecao:'',colecao_codigo:'',piramide:'',estoque_fisico:0,estoque_transito:0,ultima_venda:null};produtos.set(pk,p)}
    if(r['Coleção']!=null&&String(r['Coleção']).trim())p.colecao=String(r['Coleção']).trim();
    if(r['Coleção Cód']!=null&&String(r['Coleção Cód']).trim())p.colecao_codigo=String(r['Coleção Cód']).trim();
    if(r['Pirâmide']!=null&&String(r['Pirâmide']).trim())p.piramide=String(r['Pirâmide']).trim();
    p.estoque_fisico+=impNum(r['Estoque Físico']);p.estoque_transito+=impNum(r['Estoque em Trânsito']);
    const venda=impNum(r['Peças - Líquido']),dt=impIso(r['Dia'],r['Mês'],r['Ano']);
    if(venda&&dt){
      if(!p.ultima_venda||dt>p.ultima_venda)p.ultima_venda=dt;
      const a=Number(r['Ano']),m=impMes(r['Mês']),vk=[f.codigo,rf,cor,tam,a,m].join('|');
      let v=vendas.get(vk);if(!v){v={filial_codigo:f.codigo,loja:f.nome,ref:rf,cor,tamanho:tam,ano:a,mes:m,pecas_liquido:0};vendas.set(vk,v)}
      v.pecas_liquido+=venda;
    }
    if(i%12000===0){$('#impProg').value=Math.min(68,3+(i/rows.length)*65);await new Promise(requestAnimationFrame)}
  }
  if(desconhecidas.size)throw Error('Lojas não reconhecidas: '+[...desconhecidas].join(' | '));
  const esperadas=['293','488','287','761','288','1849','1848'],faltam=esperadas.filter(x=>!filiais.has(x));
  if(faltam.length)throw Error('Relatório incompleto. Faltam filiais: '+faltam.join(', '));
  IMPORT_RESULT={produtos:[...produtos.values()],vendas:[...vendas.values()],filiais:[...filiais],totalLinhas:validas,nomeArquivo:IMPORT_FILE.name};
  $('#impLinhas').textContent=validas.toLocaleString('pt-BR');$('#impFiliais').textContent=filiais.size+'/7';$('#impSkus').textContent=IMPORT_RESULT.produtos.length.toLocaleString('pt-BR');$('#impHist').textContent=IMPORT_RESULT.vendas.length.toLocaleString('pt-BR');$('#impProg').value=100;$('#impSend').disabled=false;
  impStatus('Validação concluída. A base oficial ainda não foi alterada.','ok');
 }catch(e){$('#impProg').value=0;impStatus(e.message,'bad')}finally{$('#impProcess').disabled=!IMPORT_FILE}
}
async function enviarImportacao(){
 try{
  if(!IMPORT_RESULT)return;
  if(!confirm('Publicar esta nova base para Promoção e Transferência?'))return;
  $('#impSend').disabled=true;$('#impProcess').disabled=true;$('#impProg').value=1;impStatus('Criando importação segura...');
  const ini=await api('supabaseImportStart',{meta:{nomeArquivo:IMPORT_RESULT.nomeArquivo,totalLinhas:IMPORT_RESULT.totalLinhas,totalFiliais:IMPORT_RESULT.filiais.length,totalSkus:IMPORT_RESULT.produtos.length,filiais:IMPORT_RESULT.filiais}});
  const id=ini.importacaoId,B=250,total=IMPORT_RESULT.produtos.length+IMPORT_RESULT.vendas.length;let feito=0;
  for(const [tipo,arr] of [['produtos',IMPORT_RESULT.produtos],['vendas',IMPORT_RESULT.vendas]]){
    for(let i=0;i<arr.length;i+=B){const lote=arr.slice(i,i+B);await api('supabaseImportBatch',{payload:{importacaoId:id,tipo,rows:lote}});feito+=lote.length;$('#impProg').value=Math.max(2,Math.round(feito/total*95));impStatus(`Enviando ${feito.toLocaleString('pt-BR')} de ${total.toLocaleString('pt-BR')} registros...`)}
  }

  await api('supabaseImportFinish',{importacaoId:id});$('#impProg').value=100;impStatus('Banco atualizado com sucesso. Promoção e Transferência já têm a nova base disponível.','ok');toast('Banco atualizado com sucesso.');
 }catch(e){impStatus(e.message,'bad')}finally{$('#impProcess').disabled=!IMPORT_FILE;$('#impSend').disabled=!IMPORT_RESULT}
}

async function refresh(){const j=await api('bootstrap');S.data=j;S.user=j.user}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function openScanner(){S.scannerLocked=false;$('#scanner').classList.remove('hidden');$('#scannerView').classList.remove('paused');$('#scannerInfo').textContent='Aponte para o EAN-13 da peça.';try{S.scanner=new Html5Qrcode('html5-ean');await S.scanner.start({facingMode:'environment'},{fps:8,qrbox:{width:280,height:220},experimentalFeatures:{useBarCodeDetectorIfSupported:true},rememberLastUsedCamera:true},async text=>{if(S.scannerLocked)return;const e=(String(text).match(/\d{13}/)||[])[0];if(!e)return;S.scannerLocked=true;$('#scannerView').classList.add('paused');$('#scannerInfo').innerHTML=`EAN <b>${e}</b> capturado. Confirme o item e depois toque aqui para liberar o próximo.`;beep();processEAN(e)},()=>{})}catch(e){toast('Não foi possível abrir a câmera.');closeScanner()}}
$('#scannerInfo').onclick=()=>{if(S.scannerLocked){S.scannerLocked=false;$('#scannerView').classList.remove('paused');$('#scannerInfo').textContent='Scanner liberado. Aponte para o próximo EAN-13.'}}
async function closeScanner(){try{if(S.scanner){await S.scanner.stop().catch(()=>{});await S.scanner.clear().catch(()=>{});S.scanner=null}}catch{}$('#scanner').classList.add('hidden')}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;g.gain.value=.12;o.start();o.stop(a.currentTime+.08)}catch{}}

$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')&&S.transferGenRows?.length)fecharGeradorTransferencia()});
if(S.token){boot().catch(e=>{$('#login').classList.remove('hidden');$('#system').classList.add('hidden');$('#loginErr').textContent=e.message||'Não foi possível reconectar. Tente novamente.';$('#loginErr').classList.remove('hidden')})}
</script>
</body></html>
