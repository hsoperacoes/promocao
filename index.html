<body>
<div id="login" class="login"><div class="loginCard"><div class="brand">HS<small>CENTRAL</small></div><h1>Promoção de Loja</h1><div class="muted">Acesso ao sistema</div><div id="loginErr" class="hidden" style="margin:14px 0;color:#b92e3d;font-weight:800"></div><form id="loginForm"><div class="field"><label>Usuário</label><input id="user" class="input" autocomplete="off" autocapitalize="none" spellcheck="false"></div><div class="field"><label>Senha</label><input id="pass" class="input" type="password" autocomplete="new-password"></div><button class="btn primary full">Entrar</button></form></div></div>
<div id="system" class="hidden"><div class="mobileTop"><div class="brand">HS<small>CENTRAL</small></div><span id="mobileWho"></span></div><div class="shell"><aside class="side"><div class="brand">HS<small>CENTRAL</small></div><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div><div id="mobileNav" class="mobileNav"></div></div>
<div id="scanner" class="hidden"><div class="scannerCard"><div class="scannerTop"><b>Scanner EAN</b><button class="btn" onclick="closeScanner()">Fechar</button></div><div class="scannerView" id="scannerView"><div id="html5-ean"></div></div><div id="scannerInfo" class="scannerInfo">Aponte para o EAN-13 da peça.</div></div></div>
<div id="modal" class="modalBack hidden"><div id="modalBox" class="modal"></div></div>
<div id="loading" class="loading hidden"><div class="spinner"></div></div><div id="toast" class="toast hidden"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyu4WrW945rJlJ9dAu8vhyJAFsdPZchU-eCNB5ZVe5nCODEw1kb3G_vTWPX9UCooF51sw/exec';
const DB_NAME='hs_promocao_v1',DB_STORE='cache';
const S={token:localStorage.getItem('hs_promo_token')||'',user:null,data:null,page:'inicio',catalogo:{},bi:{},precos:{},pending:null,scanner:null,scannerLocked:false,baseSyncPromise:null,basesHydrated:false,pendingWrites:0,analysisCache:{},transfer:null,transferPeriod:6,transferCoverage:1,transferPyramids:new Set(),transferColumnFilters:{},transferFilterDraft:{},transferFilterOpen:'',transferSort:{key:'',dir:0},transferGenOrigin:'',transferGenRows:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function load(v=true){$('#loading').classList.toggle('hidden',!v)} function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
async function apiLong(api,p={}){
  const params={api,token:S.token,_ts:Date.now()}; Object.entries(p).forEach(([k,v])=>{params[k]=typeof v==='object'?JSON.stringify(v):String(v??'')}); const b=new URLSearchParams(params);
  const r=await fetch(API_URL,{method:'POST',body:b,redirect:'follow',cache:'no-store'});
  const t=await r.text();
  if(!r.ok)throw Error('HTTP '+r.status);
  let j;try{j=JSON.parse(t)}catch{throw Error('Resposta inválida do servidor.')}
  if(!j.ok)throw Error(j.message||'Não foi possível concluir.');
  return j;
}

async function api(api,p={}){
  if(!API_URL.startsWith('https://script.google.com/'))throw Error('Configure API_URL no index.html.');
  const params={api,token:S.token,_ts:Date.now()};
  Object.entries(p).forEach(([k,v])=>{params[k]=typeof v==='object'?JSON.stringify(v):String(v??'')});
  const b=new URLSearchParams(params);
  const r=await fetch(API_URL,{method:'POST',body:b,redirect:'follow',cache:'no-store'});
  const t=await r.text();
  if(!r.ok)throw Error('HTTP '+r.status);
  let j;
  try{j=JSON.parse(t)}catch{throw Error('Resposta inválida do servidor.')}
  if(!j.ok)throw Error(j.message||'Não foi possível concluir.');
  return j;
}
function db(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(DB_STORE);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function cacheSet(k,v){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function cacheGet(k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(DB_STORE).objectStore(DB_STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').classList.add('hidden');try{load();const j=await api('login',{usuario:$('#user').value.trim(),senha:$('#pass').value});S.token=j.token;localStorage.setItem('hs_promo_token',S.token);await boot()}catch(x){$('#loginErr').textContent=x.message;$('#loginErr').classList.remove('hidden')}finally{load(false)}};
async function boot(){if(!S.basesHydrated)await hydrateLocalBases();const j=await api('bootstrap');S.user=j.user;S.data=j;$('#login').classList.add('hidden');$('#system').classList.remove('hidden');$('#mobileWho').textContent=S.user.perfil==='ADMIN'?'Léo':S.user.filialNome;renderNav();go('inicio');if(S.user.perfil==='FILIAL')syncBases().then(()=>{if(S.page==='inicio')renderInicio()}).catch(()=>{})}
function logout(){S.token='';localStorage.removeItem('hs_promo_token');$('#user').value='';$('#pass').value='';location.reload()}
function navItems(){return S.user.perfil==='ADMIN'?[['inicio','Início'],['transferencia','Transferência'],['historico','Histórico'],['usuarios','Usuários']]:[['inicio','Início'],['coleta','Bipar peças'],['lista','Minha lista']]}
function renderNav(){let h=navItems().map(([p,n])=>`<button data-p="${p}" onclick="go('${p}')">${n}</button>`).join('')+`<button onclick="logout()">Sair</button>`;$('#nav').innerHTML=h;$('#mobileNav').innerHTML=h}
function head(t,s=''){return `<div class="top"><div><h1>${esc(t)}</h1>${s?`<div class="muted">${esc(s)}</div>`:''}</div><span class="chip">${esc(S.user.perfil==='ADMIN'?'Léo • Admin':S.user.filialNome)}</span></div>`}
function go(p){S.page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({inicio:renderInicio,coleta:renderColeta,lista:renderLista,analise:renderAnalise,historico:renderHistorico,filiais:renderFiliais,usuarios:renderUsuarios,transferencia:renderTransferencia}[p]||renderInicio)();scrollTo(0,0)}
async function hydrateLocalBases(){
  try{for(const tipo of ['catalogo','bi','precos']){const local=await cacheGet('base_'+tipo);if(local&&local.dados)S[tipo]=local.dados}S.basesHydrated=true;return true}catch(e){S.basesHydrated=true;return false}
}
async function syncBases(){
  if(S.baseSyncPromise)return S.baseSyncPromise;
  S.baseSyncPromise=(async()=>{try{
    const ver=await api('versoesBases');
    const tipos=['catalogo','bi','precos'],faltando=[];
    for(const tipo of tipos){
      const local=await cacheGet('base_'+tipo);
      if(local&&local.versao===ver[tipo])S[tipo]=local.dados;
      else faltando.push(tipo);
    }
    if(!faltando.length)return true;
    const snap=await apiLong('snapshotBases',{tipos:faltando});
    for(const tipo of faltando){
      const local={versao:snap.versoes[tipo],dados:snap.bases[tipo]||{}};
      await cacheSet('base_'+tipo,local);S[tipo]=local.dados;
    }
    return true;
  }catch(e){toast('Não foi possível atualizar as bases: '+e.message);return false}
  finally{S.baseSyncPromise=null}})();
  return S.baseSyncPromise;
}
function statusLabel(s){return ({EM_COLETA:'Em coleta',AGUARDANDO_ANALISE:'Em análise',EM_ANALISE:'Em análise',FINALIZADA:'Finalizada',CANCELADA:'Cancelada',FECHADA:'Fechada'})[String(s||'')]||String(s||'').replaceAll('_',' ')}
function coletaAberta(){return S.data?.promocao?.status==='EM_COLETA'}
function renderInicio(){if(S.user.perfil==='ADMIN'){const fs=S.data.filiais||[],ativas=fs.filter(x=>x.status==='EM_COLETA').length,aguard=fs.filter(x=>['AGUARDANDO_ANALISE','EM_ANALISE'].includes(x.status)).length;$('#main').innerHTML=head('Painel de Promoções','Controle das filiais e análises. · v16 Transferência')+`<div class="cards"><div class="card metric"><span>FILIAIS EM COLETA</span><strong>${ativas}</strong></div><div class="card metric"><span>AGUARDANDO ANÁLISE</span><strong>${aguard}</strong></div><div class="card metric"><span>FILIAIS</span><strong>${fs.length}</strong></div></div><div class="sectionTitle"><h2>Filiais</h2></div>${filiaisCards(fs)}`;return}const p=S.data.promocao,aberta=p?.status==='EM_COLETA';$('#main').innerHTML=head('Promoção — '+S.user.filialNome,aberta?'Bipe e confirme os itens que irão para análise.':'Sua lista foi enviada e está sendo analisada.')+`${!aberta?'<div class="readonlyNotice">Sua lista de promoção está em análise. Aguarde o Léo concluir a análise. Até lá você pode consultar sua lista, mas não incluir ou remover peças.</div>':''}<div class="cards" style="grid-template-columns:repeat(2,1fr)"><div class="card metric"><span>STATUS</span><strong class="statusText">${esc(statusLabel(p?.status||'FECHADA'))}</strong></div><div class="card metric"><span>ITENS NA LISTA</span><strong>${S.data.itens?.length||0}</strong></div></div>${aberta?'<button class="btn primary full" style="margin-top:15px" onclick="go(\'coleta\')">Bipar peças</button>':'<button class="btn full" style="margin-top:15px" onclick="go(\'lista\')">Consultar minha lista</button>'}`}
function filiaisCards(fs){return `<div class="cards">${fs.map(f=>{const emAnalise=['AGUARDANDO_ANALISE','EM_ANALISE'].includes(f.status);return `<div class="card"><b>${esc(f.nome)}</b><p><span class="badge ${f.status==='EM_COLETA'?'green':emAnalise?'amber':'red'}">${esc(statusLabel(f.status))}</span></p><div class="rowActions">${['FECHADA','FINALIZADA','CANCELADA'].includes(f.status)?`<button class="btn good" onclick="iniciarPromo('${f.codigo}')">Iniciar promoção</button>`:''}${f.status==='EM_COLETA'?`<button class="btn danger" onclick="fecharPromo('${f.codigo}')">Bloquear coleta</button>`:''}${emAnalise?`<button class="btn primary" onclick="abrirAnalise('${f.codigo}')">Analisar</button><button class="btn danger" onclick="cancelarPromo('${f.codigo}')">Cancelar</button>`:''}</div></div>`}).join('')}</div>`}
async function renderColeta(){if(S.user.perfil==='ADMIN')return go('inicio');if(!coletaAberta()){go('inicio');toast('Sua lista de promoção já está em análise. Aguarde a conclusão.');return}if(!Object.keys(S.catalogo).length){$('#main').innerHTML=head('Bipar peças','')+`<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="spinner" style="width:28px;height:28px;border-width:3px"></div><b>Carregando...</b></div></div>`;const ok=await syncBases();if(!ok||!Object.keys(S.catalogo).length)return;if(S.page!=='coleta')return;}$('#main').innerHTML=head('Bipar peças','Leitura por câmera ou inclusão manual.')+`<div class="scanGrid"><div class="card"><h3>Adicionar peça</h3><button class="btn good full" onclick="openScanner()">📷 Escanear EAN</button><div class="field"><label>Inclusão manual</label><div class="manual"><input id="manualEAN" class="input" inputmode="numeric" maxlength="20" placeholder="Digite ou cole o EAN"><button class="btn primary" onclick="manualEAN()">Adicionar</button></div></div><div id="candidate"></div></div><div class="card"><h3>Lista atual</h3><div id="quickList"></div></div></div>`;$('#manualEAN').onkeydown=e=>{if(e.key==='Enter')manualEAN()};renderQuick()}
function normalize(v){return String(v??'').trim().toUpperCase()}
function displayRef(v){const s=String(v??'').trim();return /^\d+$/.test(s)?s.padStart(4,'0'):s}
function latestKey(ref,cor,tam){return ['__ULTIMA__',normalize(ref),normalize(cor),normalize(tam)].join('|')}
function dateBR(v){
  const s=String(v??'').trim(); if(!s)return '-';

function thFilter(k,label){const vals=filterValues(k),applied=S.transferColumnFilters[k],active=!!(applied&&applied.size),draft=S.transferFilterDraft?.k===k?S.transferFilterDraft.selected:(active?applied:new Set(vals)),all=vals.length>0&&vals.every(v=>draft.has(v)),sm=S.transferSort?.key===k?(S.transferSort.dir===-1?'▼':'▲'):'';return `<th class="filterTh"><div class="filterHead ${active?'filtered':''}"><span class="filterLabel" onclick="sortTransfer('${k}')">${label}${sm?`<span class="sortMark">${sm}</span>`:''}</span><span class="filterIcon" onclick="event.stopPropagation();toggleTransferFilterMenu('${k}')">▾</span></div>${S.transferFilterOpen===k?`<div class="excelFilter" data-filter="${k}" onclick="event.stopPropagation()"><label class="filterAll"><input data-all type="checkbox" ${all?'checked':''} onchange="draftTransferFilterAll('${k}',this.checked)"> Selecionar todos</label>${vals.map(v=>`<label><input data-value="${esc(v)}" type="checkbox" ${draft.has(v)?'checked':''} onchange="draftTransferFilter('${k}',this.dataset.value,this.checked)"> ${esc(v)}</label>`).join('')}<div class="filterActions"><button class="btn" onclick="cancelTransferFilter('${k}')">Cancelar</button><button class="btn good" onclick="applyTransferFilter('${k}')">OK</button></div></div>`:''}</th>`}

function renderTransferenciaTela(){
  const t=S.transfer||{},rows=transferRows(),pirs=t.piramides||[],all=pirs.length&&pirs.every(p=>S.transferPyramids.has(p));
  const totalQtd=rows.reduce((s,x)=>s+Number(x.qtdSugerida||0),0),origens=new Set(rows.map(x=>x.origem)).size,dests=new Set(rows.map(x=>x.destino)).size;
  $('#main').innerHTML=head('Transferência','Sugestões por REF + COR, somando todos os tamanhos.')+`
  <div class="card transferFilters"><div class="field"><label>Período de demanda</label><div class="periodBtns">${[1,6,12].map(n=>`<button class="btn ${S.transferPeriod===n?'active':''}" onclick="setTransferPeriod(${n})">${n===1?'1 mês':n===6?'6 meses':'1 ano'}</button>`).join('')}</div></div><div class="field"><label>Cobertura mínima</label><select class="coverageSelect" onchange="setTransferCoverage(this.value)">${[.5,1,1.5,2,3].map(v=>`<option value="${v}" ${S.transferCoverage===v?'selected':''}>${String(v).replace('.',',')}x</option>`).join('')}</select><div class="coverageHint">Proteção calculada sobre a média mensal do período.</div></div><div class="field"><label>Pirâmides</label><div class="pyramidBox"><label class="pyramidCheck"><input type="checkbox" ${all?'checked':''} onchange="toggleAllPyramids(this.checked)"> Todas</label>${pirs.map(p=>`<label class="pyramidCheck"><input type="checkbox" ${S.transferPyramids.has(p)?'checked':''} onchange="toggleTransferPyramid('${esc(p)}',this.checked)">${esc(p)}</label>`).join('')}</div></div></div>
  <div class="transferKpis"><div class="card metric"><span>OPORTUNIDADES</span><strong>${rows.length}</strong></div><div class="card metric"><span>PEÇAS SUGERIDAS</span><strong>${totalQtd}</strong></div><div class="card metric"><span>ORIGENS</span><strong>${origens}</strong></div><div class="card metric"><span>DESTINOS</span><strong>${dests}</strong></div></div>
  <div class="transferTopActions"><button class="btn good" onclick="abrirGerarTransferencia()">Gerar transferência</button></div>
  <div class="tableWrap transferTableWrap"><table class="table transferTable"><thead><tr>${TF_COLS.map(c=>thFilter(c[0],c[1])).join('')}</tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(displayRef(x.ref))} · ${esc(x.cor)}</b></td><td>${esc(x.colecaoCod||'-')}<div class="saleMeta">${esc(x.colecao||'')}</div></td><td>${esc(x.piramide||'-')}</td><td>${esc(x.origem)}</td><td><b>${x.origemEstoque}</b>${x.origemSellin?`<div class="sellin">+${x.origemSellin} sell-in</div>`:''}</td><td>${Number(x.origemMedia||0).toFixed(2)}</td><td class="coverageCell">${x.origemCobertura>=999?'Sem venda':x.origemCobertura.toFixed(1)+'x'}</td><td class="excess">${x.excedente}</td><td>${transferDate(x.origemUltima)}</td><td><b>${esc(x.destino)}</b></td><td><b>${x.destinoEstoque}</b></td><td>${x.destinoSellin?`<span class="sellin">${x.destinoSellin} pendente</span>`:'-'}</td><td>${Number(x.destinoMedia||0).toFixed(2)}</td><td>${transferDate(x.destinoUltima)}</td><td><span class="badge green">${x.qtdSugerida} peça(s)</span></td></tr>`).join(''):`<tr><td colspan="15" class="empty">Nenhuma oportunidade encontrada com estes filtros.</td></tr>`}</tbody></table></div>`;
}
function abrirGerarTransferencia(){
  const rows=transferRows();
  const origens=[...new Set(rows.map(r=>r.origem))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if(!origens.length)return toast('Nenhuma transferência disponível com os filtros atuais.');
  S.transferGenOrigin='';S.transferGenRows=[];
  $('#modalBox').classList.add('transferGenModal');
  $('#modalBox').innerHTML=`<h3>Gerar transferência</h3><div class="muted">Escolha a filial de origem. Serão considerados somente os itens que estão visíveis nos filtros atuais.</div><div class="originGrid">${origens.map(o=>{const n=rows.filter(r=>r.origem===o).length;return `<button class="btn originChoice" onclick="selecionarOrigemTransferencia('${esc(o)}')"><b>${esc(o)}</b><div class="muted">${n} item(ns)</div></button>`}).join('')}</div><div class="rowActions"><button class="btn" onclick="fecharGeradorTransferencia()">Cancelar</button></div>`;
  $('#modal').classList.remove('hidden');
}
function selecionarOrigemTransferencia(origem){
  const rows=transferRows().filter(r=>r.origem===origem);
  S.transferGenOrigin=origem;
  S.transferGenRows=rows.map((r,i)=>({...r,_id:i,_sel:true,_qtd:Math.max(1,Number(r.qtdSugerida||1))}));
  renderGeradorItens();
}
function renderGeradorItens(){
  const rows=S.transferGenRows||[],sel=rows.filter(r=>r._sel),total=sel.reduce((a,r)=>a+Number(r._qtd||0),0);
  $('#modalBox').innerHTML=`<h3>Transferência — ${esc(S.transferGenOrigin)}</h3><div class="muted">Revise os itens, desmarque o que não será transferido e altere a quantidade quando necessário.</div><div style="overflow:auto"><table class="genTable"><thead><tr><th>Incluir</th><th>REF + COR</th><th>Coleção</th><th>Destino</th><th>Estoque origem</th><th>Sugestão</th><th>Qtd. transferir</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" ${r._sel?'checked':''} onchange="alterarItemTransferencia(${r._id},'sel',this.checked)"></td><td><b>${esc(displayRef(r.ref))} · ${esc(r.cor)}</b></td><td>${esc(r.colecaoCod||'-')}${r.colecao?`<div class="saleMeta">${esc(r.colecao)}</div>`:''}</td><td><b>${esc(r.destino)}</b></td><td><b>${r.origemEstoque}</b></td><td>${r.qtdSugerida}</td><td><input class="qtyEdit" type="number" min="1" max="${Math.max(1,r.excedente)}" value="${r._qtd}" ${r._sel?'':'disabled'} onchange="alterarItemTransferencia(${r._id},'qtd',this.value)"></td></tr>`).join('')}</tbody></table></div><div class="genFoot"><div><b>${sel.length}</b> item(ns) selecionado(s) · <b>${total}</b> peça(s)</div><div class="rowActions"><button class="btn" onclick="abrirGerarTransferencia()">Voltar</button><button class="btn good" ${sel.length?'':'disabled'} onclick="gerarPdfTransferencia()">Gerar PDF</button></div></div>`;
}
function alterarItemTransferencia(id,tipo,valor){const r=(S.transferGenRows||[]).find(x=>x._id===id);if(!r)return;if(tipo==='sel')r._sel=!!valor;else r._qtd=Math.max(1,Math.min(Number(r.excedente||999999),Math.floor(Number(valor)||1)));renderGeradorItens()}
function fecharGeradorTransferencia(){S.transferGenOrigin='';S.transferGenRows=[];$('#modalBox').classList.remove('transferGenModal');closeModal()}
function gerarPdfTransferencia(){
  const itens=(S.transferGenRows||[]).filter(r=>r._sel&&Number(r._qtd)>0);if(!itens.length)return toast('Selecione pelo menos um item.');
  if(!window.jspdf||!window.jspdf.jsPDF)return toast('Não foi possível carregar o gerador de PDF.');
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),navy=[8,47,81],blue=[20,118,223],light=[242,246,249],text=[23,35,51];
  const now=new Date(),data=now.toLocaleDateString('pt-BR'),hora=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),usuario=S.user?.nome||S.user?.usuario||'Léo';
  doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(29);doc.text('HS',16,20);doc.setFontSize(7);doc.setCharSpace(2);doc.text('CENTRAL',16,25);doc.setCharSpace(0);
  doc.setDrawColor(...navy);doc.setLineWidth(.5);doc.line(43,10,43,29);doc.setFontSize(10);doc.text('REDE HERING',49,16);doc.setFontSize(18);doc.text('TRANSFERÊNCIA ENTRE LOJAS',49,24);
  doc.setFillColor(246,248,250);doc.roundedRect(145,9,49,22,2,2,'F');doc.setFontSize(7);doc.setTextColor(80,100,116);doc.text('DATA DE EMISSÃO:',149,15);doc.text('HORA:',149,21);doc.text('USUÁRIO:',149,27);doc.setTextColor(...text);doc.setFont('helvetica','bold');doc.text(data,176,15);doc.text(hora,176,21);doc.text(String(usuario),176,27);
  doc.setFillColor(...navy);doc.roundedRect(14,37,182,13,1.5,1.5,'F');doc.setTextColor(255,255,255);doc.setFontSize(15);doc.text('TRANSFERÊNCIA DE MERCADORIAS',20,46);
  doc.setFillColor(...light);doc.roundedRect(14,54,182,17,1.5,1.5,'F');doc.setTextColor(75,91,106);doc.setFontSize(8);doc.text('FILIAL ORIGEM',20,60);doc.setTextColor(...navy);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text(String(S.transferGenOrigin),20,67);
  const body=itens.map((r,i)=>[String(i+1),`${displayRef(r.ref)} · ${r.cor}`,`${r.colecaoCod||'-'}${r.colecao?'\n'+r.colecao:''}`,String(r.origemEstoque),String(r.destino),String(r._qtd)]);
  doc.autoTable({startY:76,head:[['#','REF + COR','COLEÇÃO','ESTOQUE ATUAL','DESTINO','QTD. TRANSFERIR']],body,theme:'grid',styles:{font:'helvetica',fontSize:8.5,cellPadding:3.2,textColor:text,lineColor:[218,226,233],lineWidth:.2},headStyles:{fillColor:navy,textColor:255,fontStyle:'bold',fontSize:7.5},columnStyles:{0:{cellWidth:9,halign:'center'},1:{cellWidth:39,fontStyle:'bold'},2:{cellWidth:38},3:{cellWidth:26,halign:'center'},4:{cellWidth:39,fontStyle:'bold'},5:{cellWidth:29,halign:'center',fontStyle:'bold'}}});
  let y=doc.lastAutoTable.finalY+7,total=itens.reduce((a,r)=>a+Number(r._qtd||0),0);doc.setFillColor(...navy);doc.roundedRect(128,y,68,11,1.5,1.5,'F');doc.setTextColor(255,255,255);doc.setFontSize(9);doc.text('TOTAL DE PEÇAS:',133,y+7);doc.setFontSize(13);doc.text(String(total),185,y+7,{align:'right'});y+=18;
  if(y>235){doc.addPage();y=18}doc.setFillColor(...light);doc.roundedRect(14,y,182,31,2,2,'F');doc.setTextColor(...navy);doc.setFontSize(9);doc.text('OBSERVAÇÕES',20,y+7);doc.setTextColor(55,73,89);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text('1. Conferir o estoque físico antes da separação.',20,y+14);doc.text('2. Separar e identificar as mercadorias por filial destino.',20,y+20);doc.text('3. Em caso de dúvida, entrar em contato com o escritório.',20,y+26);
  doc.setTextColor(...navy);doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('HS',16,285);doc.setFontSize(8);doc.setCharSpace(1.5);doc.text('CENTRAL',29,285);doc.setCharSpace(0);
  doc.save(`Transferencia_${String(S.transferGenOrigin).replace(/[^A-Za-z0-9_-]+/g,'_')}_${data.replaceAll('/','-')}.pdf`);
  toast('PDF gerado. A análise permanece inalterada.');
}

function renderUsuarios(){const fs=S.data.filiais||[];$('#main').innerHTML=head('Usuários e senhas','Léo pode alterar a senha de cada filial.')+`<div class="card">${fs.map(f=>`<div class="userRow"><div><b>${esc(f.nome)}</b><div class="muted">Usuário: ${esc(f.usuario)}</div></div><div><button class="btn primary" onclick="changePass('${f.codigo}','${esc(f.nome)}','${esc(f.usuario)}')">Alterar senha</button></div></div>`).join('')}</div>`}
function changePass(c,nome,usuario){$('#modalBox').innerHTML=`<h3>Alterar senha — ${esc(nome)}</h3><div class="muted" style="margin-bottom:12px">Usuário: ${esc(usuario)}</div><div class="field"><label>Nova senha</label><input id="newPass" class="input" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmar nova senha</label><input id="newPass2" class="input" type="password" autocomplete="new-password"></div><div class="rowActions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmPass('${c}','${esc(usuario)}')">Salvar nova senha</button></div>`;$('#modal').classList.remove('hidden')}
async function confirmPass(c,usuario){const a=$('#newPass').value,b=$('#newPass2').value;if(!a)return toast('Informe a nova senha.');if(a!==b)return toast('As senhas não conferem.');try{load();await api('salvarUsuario',{filialCodigo:c,usuario,senha:a});closeModal();toast('Senha alterada.')}catch(e){toast(e.message)}finally{load(false)}}
function closeModal(){$('#modal').classList.add('hidden')}
async function refresh(){const j=await api('bootstrap');S.data=j;S.user=j.user}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function openScanner(){S.scannerLocked=false;$('#scanner').classList.remove('hidden');$('#scannerView').classList.remove('paused');$('#scannerInfo').textContent='Aponte para o EAN-13 da peça.';try{S.scanner=new Html5Qrcode('html5-ean');await S.scanner.start({facingMode:'environment'},{fps:8,qrbox:{width:280,height:220},experimentalFeatures:{useBarCodeDetectorIfSupported:true},rememberLastUsedCamera:true},async text=>{if(S.scannerLocked)return;const e=(String(text).match(/\d{13}/)||[])[0];if(!e)return;S.scannerLocked=true;$('#scannerView').classList.add('paused');$('#scannerInfo').innerHTML=`EAN <b>${e}</b> capturado. Confirme o item e depois toque aqui para liberar o próximo.`;beep();processEAN(e)},()=>{})}catch(e){toast('Não foi possível abrir a câmera.');closeScanner()}}
$('#scannerInfo').onclick=()=>{if(S.scannerLocked){S.scannerLocked=false;$('#scannerView').classList.remove('paused');$('#scannerInfo').textContent='Scanner liberado. Aponte para o próximo EAN-13.'}}
async function closeScanner(){try{if(S.scanner){await S.scanner.stop().catch(()=>{});await S.scanner.clear().catch(()=>{});S.scanner=null}}catch{}$('#scanner').classList.add('hidden')}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=900;g.gain.value=.12;o.start();o.stop(a.currentTime+.08)}catch{}}
if(S.token){boot().catch(e=>{$('#login').classList.remove('hidden');$('#system').classList.add('hidden');$('#loginErr').textContent=e.message||'Não foi possível reconectar. Tente novamente.';$('#loginErr').classList.remove('hidden')})}
</script>
